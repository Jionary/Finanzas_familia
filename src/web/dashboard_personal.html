<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md flex flex-col gap-8">
      <h1
        class="text-3xl font-extrabold text-slate-800 text-center mb-10 tracking-tight"
        id="Titulo-dashboard-personal"
      ></h1>
      <div class="grid gap-4">
        <div
          class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col gap-1"
        >
          <p
            class="titulo-color-dinamico-db-personal text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Gastos Totales personales
          </p>
          <p class="text-3xl font-extrabold text-slate-800">
            <span id="Total-personal">0.00</span>
          </p>
        </div>
        <div
          class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col gap-1"
        >
          <p
            class="titulo-color-dinamico-db-personal text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Gastos Fijos personales
          </p>
          <p class="text-3xl font-extrabold text-slate-800">
            <span id="Gastos-fijos-personales">0.00</span>
          </p>
        </div>
        <div
          class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col gap-1"
        >
          <p
            class="titulo-color-dinamico-db-personal text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Gastos personales en tickets
          </p>
          <p class="text-3xl font-extrabold text-slate-800">
            <span id="Gastos-tickets-personales">0.00</span>
          </p>
        </div>
      </div>
    </div>
    <script src="dashboard_personal.js"></script>
  </body>
</html>
