<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Dashboard general</title>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md flex flex-col gap-8">
      <h1
        class="text-3xl font-extrabold text-slate-800 text-center mb-10 tracking-tight"
        id="Titulo-dashboard"
      ></h1>
      <div class="grid gap-4">
        <div
          class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col gap-1"
        >
          <p
            class="text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Gastos Totales
          </p>
          <p class="text-3xl font-extrabold text-slate-800">
            <span id="Total">0.00</span>
          </p>
        </div>

        <div
          class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col gap-1"
        >
          <p
            class="text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Gastos Fijos
          </p>
          <p class="text-3xl font-extrabold text-slate-800">
            <span id="Gastos-fijos">0.00</span>
          </p>
        </div>

        <div
          class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col gap-1"
        >
          <p
            class="text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Gastos en Tickets
          </p>
          <p class="text-3xl font-extrabold text-slate-800">
            <span id="Gastos-tickets">0.00</span>
          </p>
        </div>
      </div>
      <div id="botones" class="flex flex-col gap-3 mt-4">
        <button
          id="btn-registro-ticket"
          onclick="window.location.href='registros.html'"
          class="w-full py-4 rounded-2xl bg-slate-900 text-white"
        >
          Registrar ticket
        </button>
        <button
          id="btn-registro-gasto"
          onclick="window.location.href='registros.html'"
          class="w-full py-4 rounded-2xl bg-slate-900 text-white"
        >
          Registrar gasto fijo
        </button>
        <button
          id="btn-dashboard-personal"
          onclick="window.location.href='registros.html'"
          class="w-full py-4 rounded-2xl bg-slate-900 text-white"
        >
          Ir al dashboard personal
        </button>
      </div>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
