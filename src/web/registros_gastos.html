<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Página de registro de gastos fijos</title>
  </head>
  <body>
    <div id="contenedor-registro-gasto">
      <input
        type="text"
        name="Concepto"
        placeholder="Ingrese el concepto"
        id="Input-concepto"
        class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-blue-500"
      />
      <input
        type="number"
        name="Monto"
        placeholder="Ingrese el monto"
        id="Input-monto"
        class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-blue-500"
      />
      <input
        type="number"
        min="1"
        max="31"
        name="Dia de pago"
        placeholder="Ingrese el día de pago"
        id="Input-dia-pago"
        class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-blue-500"
      />
      <select
        name="Frecuencia"
        id="Input-frecuencia"
        class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-blue-500"
      >
        <option value="MENSUAL">MENSUAL</option>
        <option value="ANUAL">ANUAL</option>
      </select>
      <select
        name="Categoria"
        id="Input-categoria"
        class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-blue-500"
      ></select>
    </div>
  </body>
</html>
