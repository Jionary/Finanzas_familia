<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Finanzas familiares</title>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <div
      class="bg-white w-full max-w-md p-10 rounded-[2rem] shadow-2xl border border-slate-100"
      id="pantalla-login"
    >
      <h1
        class="text-3xl font-extrabold text-slate-800 text-center mb-10 tracking-tight"
      >
        Finazas familia Gutiérrez Moreno
      </h1>
      <div class="flex flex-col space-y-4">
        <button
          class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-red-200 transition duration-300 transform hover:-translate-y-1"
          id="btn-papa"
        >
          Papá
        </button>
        <button
          class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition duration-300 transform hover:-translate-y-1"
          id="btn-jio"
        >
          Jio
        </button>
        <button
          class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-200 transition duration-300 transform hover:-translate-y-1"
          id="btn-mama"
        >
          Mamá
        </button>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
